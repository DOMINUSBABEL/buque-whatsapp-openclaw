version: '3.8'

services:
  buque-swarm:
    build:
      context: .
      dockerfile: Dockerfile
    image: buque-whatsapp-openclaw:latest
    container_name: buque_b2b_swarm
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./whatsapp_auth_info:/app/whatsapp_auth_info
      - ./data:/app/data
      - ./generated_sites:/app/generated_sites
      - ./generated_videos:/app/generated_videos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
